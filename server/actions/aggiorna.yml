# Da copiare in .github/workflows/ (al posto dell'attuale) quando il server pubblica.
name: Aggiorna dati e pubblica la mappa

# Versione "di riserva": gli orari e il push li gestisce il server (server/crontab).
# Resta lanciabile a mano se il server è fermo.
on:
  workflow_dispatch:
    inputs:
      modo:
        description: "Tipo di aggiornamento"
        type: choice
        options: [completo, leggero]
        default: completo

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: aggiorna
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scegli il tipo di aggiornamento
        id: modo
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then m="${{ inputs.modo }}";
          else m=completo; fi
          echo "modo=$m" >> "$GITHUB_OUTPUT"; echo "Aggiornamento: $m"

      - name: Scarica i dati e prepara la mappa
        run: python script/aggiorna.py --${{ steps.modo.outputs.modo }}

      - name: Salva i dati nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/dati data
          if git diff --cached --quiet; then echo "Nessuna novità"; exit 0; fi
          git commit -q -m "Dati del $(TZ=Europe/Rome date '+%Y-%m-%d %H:%M') (${{ steps.modo.outputs.modo }})"
          git pull -q --rebase origin main && git push -q origin HEAD:main

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  pubblica:
    needs: aggiorna
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
