name: Inventario Forestale Toscano (campione)

# Solo a mano: legge l'Inventario Forestale Toscano su un campione di maglie di bosco della mappa (data/boschi/ift_punti.json),
# per confrontarlo con la Carta degli Habitat e con Corine. Non tocca la mappa.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  campiona:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: PYTHONUNBUFFERED=1 timeout 55m python script/boschi_ift.py
        continue-on-error: true
      - name: Salva
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/boschi/ift_punti.json
          git commit -q -m "Inventario Forestale Toscano, campione [skip ci]" || exit 0
          for i in 1 2 3 4 5 6; do git pull -q --rebase -X theirs origin ${{ github.ref_name }} && git push -q origin HEAD:${{ github.ref_name }} && exit 0; git rebase --abort 2>/dev/null || true; sleep $((RANDOM % 25 + 10)); done; exit 1
