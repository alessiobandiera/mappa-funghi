name: Pioggia prevista a 2 settimane contro pioggia misurata

# Solo a mano: corse passate complete (Single Runs API di Open-Meteo) contro la pioggia SIR delle stazioni del confronto
# mensile, anticipi 0-14 giorni (data/previsioni/lunghe_*.json, LUNGHE.md). Serve per la previsione a 3 settimane. Non tocca la mappa.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: previsioni-lunghe
  cancel-in-progress: false

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: PYTHONUNBUFFERED=1 timeout 8m python script/previsioni_lunghe.py 2>&1 | tee data/previsioni/lungo_sonda_suolo.txt
        continue-on-error: true
        env:
          SONDA_SUOLO: "1"
      - name: Salva
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/previsioni/lungo_sonda_suolo.txt
          git commit -q -m "Sonda suolo a 16 giorni [skip ci]" || exit 0
          for i in 1 2 3 4 5 6; do git pull -q --rebase -X theirs origin ${{ github.ref_name }} && git push -q origin HEAD:${{ github.ref_name }} && exit 0; git rebase --abort 2>/dev/null || true; sleep $((RANDOM % 25 + 10)); done; exit 1

  scarica:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        modello: [ecmwf_ifs, ecmwf_ifs025, ecmwf_aifs025_single, gfs_seamless]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scarica
        run: PYTHONUNBUFFERED=1 timeout 110m python script/previsioni_lunghe.py 2>&1 | tee data/previsioni/lunghe_${{ matrix.modello }}.log
        continue-on-error: true
        env:
          MODELLI: ${{ matrix.modello }}
          SOLO_SCARICA: "1"
      - name: Salva
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/previsioni
          git commit -q -m "Corse passate ${{ matrix.modello }} [skip ci]" || exit 0
          for i in 1 2 3 4 5 6; do git pull -q --rebase -X theirs origin ${{ github.ref_name }} && git push -q origin HEAD:${{ github.ref_name }} && exit 0; git rebase --abort 2>/dev/null || true; sleep $((RANDOM % 25 + 10)); done; exit 1

  confronta:
    needs: scarica
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python script/previsioni_lunghe.py > /dev/null
        env:
          SOLO_CONFRONTO: "1"
      - name: Salva
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/previsioni/LUNGHE.md
          git commit -q -m "Pioggia prevista a 2 settimane: confronto [skip ci]" || exit 0
          for i in 1 2 3 4 5 6; do git pull -q --rebase -X theirs origin ${{ github.ref_name }} && git push -q origin HEAD:${{ github.ref_name }} && exit 0; git rebase --abort 2>/dev/null || true; sleep $((RANDOM % 25 + 10)); done; exit 1
