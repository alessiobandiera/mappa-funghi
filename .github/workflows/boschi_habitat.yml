name: Boschi dalla Carta degli Habitat (ISPRA)

# Solo a mano: scarica i poligoni di bosco della Carta degli Habitat ISPRA 1:50.000 per l'area della mappa e li salva in
# data/boschi/habitat_boschi.geojson.gz. Non tocca la mappa: le griglie si rifanno con script/boschi_tipi.py.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: boschi-habitat
  cancel-in-progress: true

jobs:
  scarica:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: PYTHONUNBUFFERED=1 python script/boschi_habitat.py 2>&1 | tee data/boschi/habitat.log
      - name: Salva
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/boschi/habitat_boschi.geojson.gz data/boschi/habitat.log
          git commit -q -m "Boschi dalla Carta degli Habitat ISPRA [skip ci]" || exit 0
          for i in 1 2 3 4 5 6; do git pull -q --rebase -X theirs origin ${{ github.ref_name }} && git push -q origin HEAD:${{ github.ref_name }} && exit 0; git rebase --abort 2>/dev/null || true; sleep $((RANDOM % 25 + 10)); done; exit 1
