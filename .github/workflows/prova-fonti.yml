name: Prova fonti dati
# Verifica che dai server di GitHub si raggiungano le fonti usate dalla mappa.
on:
  push:
    paths: [".github/workflows/prova-fonti.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prova:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Controlla le fonti
        run: |
          exec > >(tee prova-fonti.txt) 2>&1
          prova() {
            nome="$1"; url="$2"; trova="$3"
            out=$(curl -sS -L -m 60 -A "mappa-funghi (github actions)" -o /tmp/r -w "%{http_code} %{size_download}" "$url" 2>&1) || out="ERRORE $out"
            echo "== $nome: $out"
            [ -n "$trova" ] && grep -o "$trova[^)]\{0,160\}" /tmp/r | head -2 || true
          }
          prova "CFR pioggia cumulata" "https://www.cfr.toscana.it/monitoraggio/stazioni.php?type=pluvio_men" '"TOS03001841"'
          prova "CFR temperatura"      "https://www.cfr.toscana.it/monitoraggio/stazioni.php?type=termo" '"TOS03001841"'
          prova "CFR umidita"          "https://www.cfr.toscana.it/monitoraggio/stazioni.php?type=igro" '"TOS03001841"'
          prova "CFR vento"            "https://www.cfr.toscana.it/monitoraggio/stazioni.php?type=anemo" '"TOS03001841"'
          prova "CFR elenco stazioni"  "https://www.cfr.toscana.it/monitoraggio/actions.php?action=list&rt=0&type_gauge=pluvio&speed=km/h" '"Pizzorne'
          prova "SIR archivio Pizzorne" "https://www.sir.toscana.it/archivio/download.php?IDST=pluvio&IDS=TOS03001841" ''
          tail -3 /tmp/r
          prova "Open-Meteo previsione" "https://api.open-meteo.com/v1/forecast?latitude=43.93&longitude=10.61&daily=precipitation_sum&forecast_days=3&timezone=Europe/Rome" ''
          head -c 300 /tmp/r; echo
          prova "Consorzio Borgotaro" "https://www.fungodiborgotaro.com/stannonascendo.php" ''
          echo "IP del runner:"; curl -sS -m 20 https://api.ipify.org; echo
      - name: Salva il risultato nel repository
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add prova-fonti.txt
          git commit -m "Risultato prova fonti" && git push
