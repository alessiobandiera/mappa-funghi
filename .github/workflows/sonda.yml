name: Sonda (scarica pagine per analisi)

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "URL separati da spazio"
        required: true

permissions:
  contents: write

concurrency:
  group: sonda
  cancel-in-progress: false

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Scarica
        env:
          URLS: ${{ inputs.urls }}
        run: |
          mkdir -p data/sonde; i=0
          for u in $URLS; do i=$((i+1))
            curl -sS -L -A "Mozilla/5.0 mappa-funghi" --max-time 60 -o "data/sonde/$i.bin" -w "$i %{http_code} %{content_type} %{size_download} $u\n" "$u" >> data/sonde/indice.txt || echo "$i ERRORE $u" >> data/sonde/indice.txt
          done
      - name: Salva
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sonde
          git commit -q -m "Sonda [skip ci]" || exit 0
          git pull -q --rebase origin main && git push -q origin HEAD:main
