name: Scarica meteo dei casi di verifica

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: valida
  cancel-in-progress: false

jobs:
  valida:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pillow
      - run: python script/valida_scarica.py
      - name: Salva nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/validazione
          git commit -q -m "Meteo storico dei casi di verifica [skip ci]" || exit 0
          git pull -q --rebase origin main && git push -q origin HEAD:main
