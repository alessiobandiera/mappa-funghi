name: Sonda previsione a 3 settimane

# Solo a mano: cosa danno Open-Meteo e i suoi archivi oltre i 7 giorni. Salva solo l'uscita in data/previsioni/lungo_sonda.txt.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: mkdir -p data/previsioni && PYTHONUNBUFFERED=1 timeout 15m python script/lungo_sonda.py 2>&1 | tee data/previsioni/lungo_sonda.txt
        continue-on-error: true
      - name: Salva
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/previsioni/lungo_sonda.txt
          git commit -q -m "Sonda previsione a 3 settimane [skip ci]" || exit 0
          for i in 1 2 3 4 5 6; do git pull -q --rebase -X theirs origin ${{ github.ref_name }} && git push -q origin HEAD:${{ github.ref_name }} && break; git rebase --abort 2>/dev/null || true; sleep 5; done
