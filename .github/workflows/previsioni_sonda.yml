name: Sonda previsioni (LaMMA, Open-Meteo)

# Solo a mano: stampa formati e archivi delle previsioni da confrontare. Non salva nulla.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q rasterio netCDF4
      - run: python script/previsioni_sonda.py
