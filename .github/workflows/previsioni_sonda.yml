name: Sonda previsioni (LaMMA, Open-Meteo)

# Solo a mano: formati e archivi delle previsioni da confrontare. Salva solo l'uscita in data/previsioni/sonda.txt.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q rasterio netCDF4
      - run: mkdir -p data/previsioni && PYTHONUNBUFFERED=1 timeout 13m python script/previsioni_sonda.py 2>&1 | tee data/previsioni/sonda.txt
        continue-on-error: true
      - name: Salva
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/previsioni/sonda.txt
          git commit -q -m "Sonda previsioni [skip ci]" || exit 0
          for i in 1 2 3; do git pull -q --rebase -X theirs origin ${{ github.ref_name }} && git push -q origin HEAD:${{ github.ref_name }} && break; sleep 5; done
