name: Sentieri e accessi al bosco (tessere a 20 m)

# Solo a mano: scarica sentieri, forestali, strade e parcheggi da OpenStreetMap e calcola gli accessi al bosco per ogni tessera.
# Riprende da dove era arrivato; con "rifai" ricalcola tutto (per esempio una volta a stagione, per i sentieri nuovi).
on:
  workflow_dispatch:
    inputs:
      rifai:
        description: "Ricalcola anche le tessere già fatte (si/no)"
        default: "no"

permissions:
  contents: write

concurrency:
  group: sentieri
  cancel-in-progress: false

jobs:
  sentieri:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q numpy scipy pillow numba
      - name: Percorsi e accessi
        env:
          RIFAI: ${{ inputs.rifai == 'si' && '1' || '' }}
          MINUTI_MAX: "100"
        run: python script/terreno_sentieri.py
      - name: Salva e pubblica
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/terreno/s docs/terreno/sentieri.json
          git commit -q -m "Sentieri e accessi al bosco: tessere calcolate" || exit 0
          for t in 1 2 3; do git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && exit 0; git rebase --abort 2>/dev/null || true; sleep 10; done
          exit 1
