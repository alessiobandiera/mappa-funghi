name: Aggiorna dati e pubblica la mappa

on:
  schedule:
    - cron: "45 4 * * *"        # completo: 06:45 con l'ora legale, 05:45 con l'ora solare
    - cron: "15 7-19/3 * * *"   # leggero: ogni 3 ore di giorno (solo previsione)
  workflow_dispatch:
    inputs:
      modo:
        description: "Tipo di aggiornamento"
        type: choice
        options: [completo, leggero]
        default: completo
  push:
    branches: [main]
    paths: ["docs/**", "script/**", ".github/workflows/aggiorna.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: aggiorna
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scegli il tipo di aggiornamento
        id: modo
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then m="${{ inputs.modo }}";
          elif [ "${{ github.event.schedule }}" = "15 7-19/3 * * *" ] && [ -f data/cache/sir.json ]; then m=leggero;
          else m=completo; fi
          echo "modo=$m" >> "$GITHUB_OUTPUT"; echo "Aggiornamento: $m"

      - name: Scarica i dati e prepara la mappa
        run: python script/aggiorna.py --${{ steps.modo.outputs.modo }}

      - name: Salva i dati nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/dati data
          if git diff --cached --quiet; then echo "Nessuna novità"; exit 0; fi
          git commit -q -m "Dati del $(TZ=Europe/Rome date '+%Y-%m-%d %H:%M') (${{ steps.modo.outputs.modo }})"
          # se nel frattempo un altro aggiornamento ha salvato dati, nei conflitti vincono quelli di questo giro (più recenti)
          for t in 1 2 3 4 5 6; do
            git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true; sleep $((RANDOM % 25 + 10))
          done
          exit 1

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  pubblica:
    needs: aggiorna
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
