name: Sonda carte dei boschi

# Solo a mano: cerca carte dei boschi più dettagliate di Corine. Salva l'uscita in data/boschi/sonda.txt.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q rasterio
      - run: PYTHONUNBUFFERED=1 timeout 20m python script/boschi_sonda.py 2>&1 | tee data/boschi/sonda.txt
        continue-on-error: true
        env:
          GDAL_HTTP_MAX_RETRY: "3"
          GDAL_DISABLE_READDIR_ON_OPEN: "EMPTY_DIR"
      - name: Salva
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/boschi/sonda.txt
          git commit -q -m "Sonda carte dei boschi [skip ci]" || exit 0
          for i in 1 2 3 4 5 6; do git pull -q --rebase -X theirs origin ${{ github.ref_name }} && git push -q origin HEAD:${{ github.ref_name }} && exit 0; git rebase --abort 2>/dev/null || true; sleep $((RANDOM % 25 + 10)); done; exit 1
